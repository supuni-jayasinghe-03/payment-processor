spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=payment-processor-test

# Resilience4j: faster retries for tests
resilience4j.retry.instances.paymentProvider.max-attempts=3
resilience4j.retry.instances.paymentProvider.wait-duration=500ms
resilience4j.circuitbreaker.instances.paymentProvider.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProvider.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentProvider.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentProvider.minimum-number-of-calls=10

server.port=8888
provider.url=http://localhost:8888