spring.application.name=payment-processor

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.value.default.type=dev.jay.payment_processor.event.PaymentRequested
spring.kafka.consumer.group-id=payment-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.jay.payment_processor.*

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/payments
spring.data.mongodb.database=payments

# Server
server.port=8080

provider.url=http://localhost:8080


# Set the global root logging level (Defaults to INFO)
logging.level.root=INFO

# Set a level for third-party libraries (e.g., Spring Framework)
logging.level.org.springframework.web=TRACE

# Retry: 3 attempts, 2 seconds between them
resilience4j.retry.instances.paymentProvider.max-attempts=3
resilience4j.retry.instances.paymentProvider.wait-duration=2s

# Circuit breaker: open after 50% failure rate in last 5 calls, stay open 10 seconds
resilience4j.circuitbreaker.instances.paymentProvider.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProvider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentProvider.permitted-number-of-calls-in-half-open-state=2

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
